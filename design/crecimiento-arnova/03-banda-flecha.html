<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>03 · Banda oscura con flecha Arnova</title>
<style>
:root{--b9:#233159;--b8:#2b3d66;--b6:#445d86;--b3:#aebbd1;--b2:#cbd3e1;--ease:cubic-bezier(.2,.8,.2,1);--sans:"Source Sans 3 Variable","Source Sans 3",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;font-family:var(--sans);background:#f9fafb}
.band{position:relative;overflow:hidden;background:radial-gradient(120% 140% at 85% 100%,#344a71 0%,#233159 55%);color:#fff}
.inner{position:relative;max-width:1280px;margin:0 auto;padding:96px 48px;display:grid;grid-template-columns:1.2fr .8fr;gap:48px;align-items:center}
.arrow{position:absolute;right:-40px;bottom:-30px;width:620px;height:420px;pointer-events:none}
.arrow path{fill:none;stroke-width:46;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 2.6s var(--ease) .4s forwards;opacity:.9}
.statement{margin:0;font-size:clamp(28px,4vw,46px);line-height:1.15;letter-spacing:-.025em;font-weight:600;text-wrap:balance}
.statement span{color:rgba(255,255,255,.28);transition:color .6s var(--ease);animation:lit .8s var(--ease) forwards}
.statement span:nth-child(1){animation-delay:.3s}.statement span:nth-child(2){animation-delay:1.2s}.statement span:nth-child(3){animation-delay:2.1s}
.statement span:nth-child(3) strong{background:linear-gradient(90deg,#ed1c24,#f37021,#ffd400);-webkit-background-clip:text;background-clip:text;color:transparent}
.side{position:relative;z-index:1;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(6px);border-radius:16px;padding:28px}
.side h3{margin:0 0 14px;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--b2)}
.side ol{margin:0;padding:0;list-style:none;display:grid;gap:14px}
.side li{display:flex;gap:12px;align-items:center;font-size:16px}.side li i{font-style:normal;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;background:rgba(255,255,255,.12)}
.side li:last-child i{background:linear-gradient(90deg,#f04e23,#f37021)}
.btn{display:inline-block;margin-top:24px;background:#fff;color:var(--b9);text-decoration:none;font-weight:600;padding:14px 26px;border-radius:8px}.btn:focus-visible{outline:3px solid #ffd400;outline-offset:3px}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes lit{to{color:#fff}}
@media (max-width:860px){.inner{grid-template-columns:1fr;padding:64px 20px}.arrow{width:360px;height:260px;opacity:.5}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important}}
</style></head><body><main>
<section class="band" aria-labelledby="t">
  <svg class="arrow" viewBox="0 0 620 420" aria-hidden="true">
    <defs><linearGradient id="ag" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#ba141a"/><stop offset=".45" stop-color="#ed1c24"/><stop offset=".75" stop-color="#f37021"/><stop offset="1" stop-color="#ffd400"/></linearGradient></defs>
    <path d="M40 380 L240 250 L330 300 L560 70 M440 70 L560 70 L560 190" stroke="url(#ag)"/>
  </svg>
  <div class="inner">
    <h2 id="t" class="statement">
      <span>Tus ventas mantienen el negocio, </span><span>con un crédito bien manejado creces, </span><span>pero con Arnova <strong>aceleras tu crecimiento</strong> de forma cómoda.</span>
    </h2>
    <aside class="side" aria-label="Cómo te acompaña Arnova">
      <h3>Tu camino con Arnova</h3>
      <ol><li><i>1</i>Vendes y mantienes tu negocio</li><li><i>2</i>Inviertes con un crédito a tu medida</li><li><i>3</i>Aceleras con tu asesor de siempre</li></ol>
      <a class="btn" href="#contacto">Contáctanos</a>
    </aside>
  </div>
</section>
</main></body></html>
