<!doctype html>

<title>Misión y Visión — Editorial en lista</title>
<!--
  Dirección 03 · Editorial en lista.
  Lista de definición (dl): a la izquierda ícono (50px, set ilustrativo, paths reales de illustrative-icon.tsx) + término en el tamaño de los
  títulos de sección del sitio (clamp 26–34px, semibold, brand-900, -0.02em); a la derecha la definición neutral-600. Filas separadas por
  un filete neutral-200. Sin tarjetas, sin número, sin encabezado de sección extra (los términos ya hacen de títulos).
  Íconos: Misión = shield-lock (créditos seguros), Visión = briefcase (comerciantes y negocios).
-->
<style>
:root{
  --brand-900:#233159;
  --n-50:#f9fafb;--n-200:#e6eaef;--n-600:#535a65;
  --font:"Source Sans 3 Variable","Source Sans 3",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0}
body{font-family:var(--font);background:var(--n-50);color:var(--n-600);-webkit-font-smoothing:antialiased}
.ctx{display:grid;place-items:center;min-height:96px;padding:24px;background:var(--brand-900);color:#cbd3e1;font:600 13px/1.4 var(--font);letter-spacing:.04em;text-transform:uppercase;text-align:center}
.container{max-width:1280px;margin:0 auto;padding:0 48px}
section.mv{background:var(--n-50);padding:76px 0}
dl{border-top:1px solid var(--n-200)}
.row{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:48px;align-items:center;padding:44px 0;border-bottom:1px solid var(--n-200)}
dt{display:flex;align-items:center;gap:20px}
.ico{display:flex;align-items:center;justify-content:center;flex:none;width:46px;height:46px}
.ico svg{flex:none}
.term{font-weight:600;color:var(--brand-900);font-size:clamp(26px,6vw,34px);letter-spacing:-.02em;line-height:1.12}
dd{font-size:18px;line-height:1.6;color:var(--n-600);max-width:34em;text-wrap:pretty}
@media (max-width:860px){
  .container{padding:0 20px}
  section.mv{padding:56px 0}
  .row{grid-template-columns:1fr;gap:16px;padding:32px 0;align-items:start}
  dd{font-size:16px}
}
</style>
</head>
