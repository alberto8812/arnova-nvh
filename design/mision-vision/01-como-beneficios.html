<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Misión y Visión — Como Beneficios</title>
<!--
  Dirección 01 · Como Beneficios.
  Misma anatomía que las tarjetas de benefits-section.tsx: .arnova-card (borde neutral-200, fondo neutral-50, radio 10px, padding 32/28),
  ícono arriba a la izquierda (50px, set ilustrativo del cliente), número en serif cursiva brand-300 36px arriba a la derecha,
  título semibold brand-900 y texto neutral-600. Los SVG son los paths reales de illustrative-icon.tsx (viewBox 900, transform potrace).
  Copy: solo Misión y Visión (L27). Los números 01/02 son decorativos (aria-hidden), igual que en Beneficios.
  Íconos: Misión = wallet (créditos), Visión = clipboard-check (metas cumplidas).
-->
<style>
:root{
  --brand-300:#aebbd1;--brand-900:#233159;
  --n-50:#f9fafb;--n-200:#e6eaef;--n-600:#535a65;
  --shadow-lg:0 20px 40px -12px rgba(35,49,89,.12),0 2px 6px rgba(35,49,89,.05);
  --font:"Source Sans 3 Variable","Source Sans 3",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --serif:"Roboto",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0}
body{font-family:var(--font);background:var(--n-50);color:var(--n-600);-webkit-font-smoothing:antialiased}
.ctx{display:grid;place-items:center;min-height:96px;padding:24px;background:var(--brand-900);color:#cbd3e1;font:600 13px/1.4 var(--font);letter-spacing:.04em;text-transform:uppercase;text-align:center}
.container{max-width:1280px;margin:0 auto;padding:0 48px}
section.mv{background:var(--n-50);padding:76px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.card{border:1px solid var(--n-200);background:var(--n-50);border-radius:10px;padding:32px 28px;transition:transform .28s var(--ease),box-shadow .28s var(--ease),border-color .28s var(--ease)}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--brand-300)}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.ico{display:flex;align-items:center;justify-content:center;width:46px;height:46px}
.ico svg{flex:none}
.num{font-family:var(--serif);font-style:italic;color:var(--brand-300);font-size:36px;line-height:.8}
h2{font-weight:600;color:var(--brand-900);font-size:24px;letter-spacing:-.01em;margin:20px 0 8px}
p{font-size:16px;line-height:1.55;color:var(--n-600);text-wrap:pretty}
@media (max-width:860px){
  .container{padding:0 20px}
  section.mv{padding:56px 0}
  .grid{grid-template-columns:1fr}
  h2{font-size:22px}
  p{font-size:15px}
}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
</style>
</head>
<body>
<div class="ctx" aria-hidden="true" data-artboard-only>Banda «Nuestro propósito» · contexto</div>

        </div>
