<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>02 · La frase es el indicador</title>
<style>
:root{--b3:#aebbd1;--b4:#8495b5;--b5:#60759b;--b6:#445d86;--b8:#2b3d66;--b9:#233159;--n50:#f9fafb;--a5:#f37021;--ease:cubic-bezier(.2,.8,.2,1);--sans:"Source Sans 3 Variable","Source Sans 3",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:640px;display:grid;place-items:center;background:var(--n50);color:var(--b9);font-family:var(--sans)}
section{width:100%;max-width:1280px;padding:76px 48px;display:grid;grid-template-columns:3fr 2fr;gap:72px;align-items:center}
h2{margin:0;max-width:680px;font-size:40px;line-height:1.4;font-weight:600;letter-spacing:-.02em;color:var(--b9);text-wrap:balance}
/* cada cláusula = un indicador; inactiva brand-600 (6.5:1), activa brand-900 + subrayado degradado */
.c{color:var(--b6);padding-bottom:3px;background:linear-gradient(90deg,#ed1c24,#f37021) 0 100%/0% 3px no-repeat;-webkit-box-decoration-break:clone;box-decoration-break:clone;animation:cl 12s linear infinite}
.c2{animation-delay:4s}.c3{animation-delay:8s}
@keyframes cl{0%{color:var(--b6);background-size:0% 3px}3%{color:var(--b9)}9%,30%{color:var(--b9);background-size:100% 3px}34%{color:var(--b6);background-size:0% 3px}100%{color:var(--b6);background-size:0% 3px}}
h2 em{font-style:normal;font-weight:700;background:linear-gradient(90deg,#ed1c24,#f37021);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
/* medio: un poco más bajo que el texto, sin chips ni leyendas */
.media{position:relative;justify-self:end;width:100%;max-width:440px;aspect-ratio:16/10;border-radius:10px;overflow:hidden;background:var(--b9);box-shadow:0 20px 40px -12px rgba(35,49,89,.12),0 2px 6px rgba(35,49,89,.05)}
.media>svg.stage{position:absolute;inset:0;width:100%;height:100%;display:block}
.loop{position:absolute;top:12px;right:12px;width:16px;height:16px;fill:none;stroke:var(--b4);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
/* --- stand-in del video (3 loops de 4 s, sincronizados con las cláusulas) --- */
.ground{stroke:var(--b6);stroke-width:3;stroke-linecap:round}
.s{opacity:0}.s1{opacity:1;--d:0s;animation:scn1 12s linear infinite}
.s2{--d:4s;animation:scn 12s linear 4s infinite}.s3{--d:8s;animation:scn 12s linear 8s infinite}
.pop,.pc,.bar{transform-box:fill-box}
.pop{transform-origin:50% 100%;animation:pop 12s var(--ease) infinite both;animation-delay:calc(var(--d) + .3s + var(--i,0)*.14s)}
.pc{transform-origin:50% 50%;animation:pop 12s var(--ease) infinite both;animation-delay:calc(var(--d) + 1.2s + var(--i,0)*.4s)}
.bob{animation:bob 3s ease-in-out infinite;animation-delay:calc(var(--i,0)*-.7s)}
.bar{transform-origin:50% 100%;animation:grow 12s var(--ease) infinite both;animation-delay:calc(var(--d) + .1s + var(--i,0)*.14s)}
.line{stroke-dasharray:1;animation:draw 12s var(--ease) infinite both;animation-delay:calc(var(--d) + .9s)}
.head{animation:show 12s linear infinite both;animation-delay:calc(var(--d) + 2.2s)}
.adv{animation:slide 12s var(--ease) infinite both;animation-delay:calc(var(--d) + .3s)}
.hand{transform-origin:440px 100px;animation:sweep 12s ease-in-out infinite both;animation-delay:var(--d)}
@keyframes scn1{0%,30%{opacity:1}34%,96%{opacity:0}100%{opacity:1}}
@keyframes scn{0%{opacity:0}4%,30%{opacity:1}34%,100%{opacity:0}}
@keyframes pop{0%{transform:scale(0)}4%{transform:scale(1.18)}7%,100%{transform:scale(1)}}
@keyframes grow{0%{transform:scaleY(0)}8%,100%{transform:scaleY(1)}}
@keyframes draw{0%{stroke-dashoffset:1}12%,100%{stroke-dashoffset:0}}
@keyframes show{0%{opacity:0}3%,100%{opacity:1}}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes slide{0%{transform:translateX(130px);opacity:0}4%{opacity:1}14%,100%{transform:none;opacity:1}}
@keyframes sweep{0%{transform:rotate(0)}30%{transform:rotate(360deg)}100%{transform:rotate(360deg)}}
/* móvil: frase primero, medio debajo */
@media (max-width:860px){
  section{grid-template-columns:1fr;gap:32px;padding:48px 20px}
  h2{font-size:clamp(26px,7vw,32px);line-height:1.38}
  .media{max-width:none;justify-self:stretch}
}
/* sin movimiento: frase completa en brand-900 y una sola escena fija */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important}
  .c{color:var(--b9);background-size:0% 3px}
  .s2,.s3,.loop{display:none}
}
</style></head>
<body>
<main>
<section aria-labelledby="crecimiento">
  <h2 id="crecimiento"><span class="c c1">Tus ventas mantienen tu negocio,</span> <span class="c c2">un crédito bien manejado te permite crecer,</span> <span class="c c3">pero con Arnova <em>aceleras ese crecimiento</em> de forma cómoda y&nbsp;segura.</span></h2>
  <div class="media" aria-hidden="true">
    <svg class="stage" viewBox="0 0 560 360" preserveAspectRatio="xMidYMid slice" focusable="false">
      <defs>
        <linearGradient id="g" x1="140" y1="0" x2="430" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ed1c24"/><stop offset="1" stop-color="#f37021"/></linearGradient>
        <linearGradient id="gv" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#f37021"/><stop offset="1" stop-color="#ed1c24"/></linearGradient>
      </defs>
      <line class="ground" x1="30" y1="300" x2="530" y2="300"/>
      <!-- Loop A (cláusula 1) · tienda que se llena de productos -->
      <g class="s s1">
        <rect x="150" y="128" width="260" height="172" fill="#2b3d66"/>
        <rect x="140" y="96" width="28" height="34" fill="#f37021"/><rect x="168" y="96" width="28" height="34" fill="#fff"/><rect x="196" y="96" width="28" height="34" fill="#f37021"/><rect x="224" y="96" width="28" height="34" fill="#fff"/><rect x="252" y="96" width="28" height="34" fill="#f37021"/><rect x="280" y="96" width="28" height="34" fill="#fff"/><rect x="308" y="96" width="28" height="34" fill="#f37021"/><rect x="336" y="96" width="28" height="34" fill="#fff"/><rect x="364" y="96" width="28" height="34" fill="#f37021"/><rect x="392" y="96" width="28" height="34" fill="#fff"/>
        <rect x="170" y="150" width="130" height="120" rx="4" fill="#233159" stroke="#445d86" stroke-width="3"/>
        <g stroke="#60759b" stroke-width="3" stroke-linecap="round"><line x1="176" y1="192" x2="296" y2="192"/><line x1="176" y1="228" x2="296" y2="228"/><line x1="176" y1="264" x2="296" y2="264"/></g>
        <rect class="pop" style="--i:0" x="180" y="170" width="20" height="22" rx="3" fill="#aebbd1"/><rect class="pop" style="--i:1" x="208" y="176" width="20" height="16" rx="3" fill="#f37021"/><rect class="pop" style="--i:2" x="236" y="170" width="20" height="22" rx="3" fill="#fff"/><rect class="pop" style="--i:3" x="264" y="174" width="20" height="18" rx="3" fill="#8495b5"/>
        <rect class="pop" style="--i:4" x="180" y="210" width="20" height="18" rx="3" fill="#fff"/><rect class="pop" style="--i:5" x="208" y="206" width="20" height="22" rx="3" fill="#8495b5"/><rect class="pop" style="--i:6" x="236" y="212" width="20" height="16" rx="3" fill="#aebbd1"/><rect class="pop" style="--i:7" x="264" y="206" width="20" height="22" rx="3" fill="#f37021"/>
        <rect class="pop" style="--i:8" x="180" y="242" width="20" height="22" rx="3" fill="#f37021"/><rect class="pop" style="--i:9" x="208" y="246" width="20" height="18" rx="3" fill="#aebbd1"/><rect class="pop" style="--i:10" x="236" y="242" width="20" height="22" rx="3" fill="#8495b5"/><rect class="pop" style="--i:11" x="264" y="248" width="20" height="16" rx="3" fill="#fff"/>
        <rect x="330" y="176" width="56" height="124" fill="#445d86"/><rect x="338" y="184" width="40" height="44" fill="#233159"/><circle cx="342" cy="252" r="3" fill="#cbd3e1"/>
      </g>
      <!-- Loop B (cláusula 2) · barras de crecimiento con flecha y monedas -->
      <g class="s s2">
        <rect class="bar" style="--i:0" x="143" y="260" width="34" height="40" rx="3" fill="#60759b"/>
        <rect class="bar" style="--i:1" x="191" y="234" width="34" height="66" rx="3" fill="#60759b"/>
        <rect class="bar" style="--i:2" x="239" y="204" width="34" height="96" rx="3" fill="#60759b"/>
        <rect class="bar" style="--i:3" x="287" y="170" width="34" height="130" rx="3" fill="#60759b"/>
        <rect class="bar" style="--i:4" x="335" y="130" width="34" height="170" rx="3" fill="#60759b"/>
        <rect class="bar" style="--i:5" x="383" y="85" width="34" height="215" rx="3" fill="url(#gv)"/>
        <path class="line" pathLength="1" d="M160 238 L208 214 L256 184 L304 150 L352 108 L401 67" fill="none" stroke="url(#g)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        <polygon class="head" points="419,51 409,76 393,58" fill="#f37021" stroke="#f37021" stroke-width="3" stroke-linejoin="round"/>
        <g class="pc" style="--i:0"><g class="bob" style="--i:0"><circle cx="105" cy="250" r="12" fill="#ffd400" stroke="#f37021" stroke-width="3"/><circle cx="105" cy="250" r="5" fill="none" stroke="#f37021" stroke-width="2"/></g></g>
        <g class="pc" style="--i:1"><g class="bob" style="--i:1"><circle cx="92" cy="198" r="12" fill="#ffd400" stroke="#f37021" stroke-width="3"/><circle cx="92" cy="198" r="5" fill="none" stroke="#f37021" stroke-width="2"/></g></g>
        <g class="pc" style="--i:2"><g class="bob" style="--i:2"><circle cx="468" cy="104" r="12" fill="#ffd400" stroke="#f37021" stroke-width="3"/><circle cx="468" cy="104" r="5" fill="none" stroke="#f37021" stroke-width="2"/></g></g>
      </g>
      <!-- Loop C (cláusula 3) · asesor Arnova visita al comerciante, con reloj -->
      <g class="s s3">
        <rect x="90" y="140" width="160" height="160" fill="#2b3d66"/>
        <rect x="82" y="112" width="176" height="28" fill="#f37021"/>
        <rect x="100" y="164" width="40" height="40" rx="3" fill="#233159" stroke="#445d86" stroke-width="3"/>
        <rect x="150" y="200" width="50" height="100" fill="#445d86"/>
        <circle cx="235" cy="206" r="14" fill="#cbd3e1"/><rect x="220" y="224" width="30" height="76" rx="15" fill="#8495b5"/>
        <g class="adv">
          <circle cx="305" cy="206" r="14" fill="#fff"/><rect x="288" y="224" width="34" height="76" rx="17" fill="#aebbd1"/>
          <polygon points="298,254 305,240 312,254" fill="#f37021"/>
          <rect x="326" y="250" width="22" height="28" rx="3" fill="#233159" stroke="#f37021" stroke-width="3"/>
        </g>
        <circle cx="440" cy="100" r="38" fill="#2b3d66" stroke="#aebbd1" stroke-width="4"/>
        <g stroke="#aebbd1" stroke-width="3" stroke-linecap="round"><line x1="440" y1="68" x2="440" y2="74"/><line x1="440" y1="126" x2="440" y2="132"/><line x1="408" y1="100" x2="414" y2="100"/><line x1="466" y1="100" x2="472" y2="100"/></g>
        <line x1="440" y1="100" x2="456" y2="100" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
        <line class="hand" x1="440" y1="100" x2="440" y2="72" stroke="#f37021" stroke-width="4" stroke-linecap="round"/>
        <circle cx="440" cy="100" r="4" fill="#fff"/>
      </g>
    </svg>
    <svg class="loop" viewBox="0 0 24 24" focusable="false"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg>
  </div>
</section>
</main>
</body></html>
