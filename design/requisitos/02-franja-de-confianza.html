<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Requisito único — Franja de confianza</title>
<!--
  Dirección 02 · Franja de confianza.
  Franja delgada a sangre entre dos secciones (las bandas .ctx son contexto del artboard, marcadas y aria-hidden).
  Copy: solo la frase del cliente (L22), literal, en un <p>. Ícono de tienda + palomita son decorativos (aria-hidden).
  La palomita se dibuja al entrar en pantalla (IntersectionObserver añade .in); sin JS o con reduced-motion queda dibujada.
  Contraste: brand-900 sobre accent-100 (~12:1). Naranja solo en subrayado y círculo decorativos.
-->
<style>
:root{
  --brand-50:#f4f6fa;--brand-100:#e4e8f0;--brand-200:#cbd3e1;--brand-600:#445d86;--brand-900:#233159;
  --n-50:#f9fafb;--n-100:#f0f2f5;--n-200:#e6eaef;--n-600:#535a65;
  --accent-100:#fff0e5;--accent-300:#ffd3bc;
  --arrow:linear-gradient(90deg,#ed1c24,#f37021);
  --node-grad:linear-gradient(135deg,#ba141a,#f04e23);
  --shadow-xl:0 30px 60px -18px rgba(35,49,89,.35),0 8px 24px rgba(35,49,89,.12);
  --font:"Source Sans 3 Variable","Source Sans 3",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0}
body{font-family:var(--font);background:var(--n-50);color:var(--n-600);-webkit-font-smoothing:antialiased}
/* contexto del artboard (no es parte de la franja) */
.ctx{display:grid;place-items:center;min-height:120px;padding:24px;background:var(--n-50);color:var(--n-600);font:600 13px/1.4 var(--font);letter-spacing:.04em;text-transform:uppercase}
.ctx.top{border-bottom:1px solid var(--n-200)}
.ctx.bot{background:var(--brand-900);color:var(--brand-200)}

.strip{position:relative;overflow:hidden;background:var(--accent-100);border-block:1px solid var(--accent-300)}
.strip::before{content:"";position:absolute;inset:0;background:radial-gradient(520px 220px at 12% 50%,rgba(255,255,255,.75),rgba(255,255,255,0));pointer-events:none}
.inner{position:relative;max-width:1280px;margin:0 auto;padding:44px 32px;display:flex;align-items:center;justify-content:center;gap:36px}
.badge{position:relative;flex:none;width:112px;height:112px}
.circle{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--node-grad);color:#fff;box-shadow:0 18px 30px -12px rgba(186,20,26,.5),0 0 0 10px rgba(255,255,255,.55)}
.circle svg{width:56px;height:56px}
.check{position:absolute;right:-6px;bottom:-4px;width:44px;height:44px;border-radius:50%;background:var(--brand-900);border:3px solid var(--accent-100);display:grid;place-items:center;box-shadow:var(--shadow-xl)}
.check svg{width:22px;height:22px;overflow:visible}
.check path{stroke-dasharray:24;stroke-dashoffset:0}
.js .strip:not(.in) .check{transform:scale(.4);opacity:0}
.js .strip:not(.in) .check path{stroke-dashoffset:24}
.strip.in .check{animation:pop .5s var(--ease) .35s both}
.strip.in .check path{animation:draw .5s var(--ease) .65s both}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
@keyframes draw{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}
p.msg{max-width:17.5em;font-size:44px;line-height:1.2;letter-spacing:-.015em;font-weight:500;color:var(--brand-900);text-wrap:balance}
p.msg strong{font-weight:700;background:linear-gradient(transparent 62%,var(--accent-300) 62%);box-shadow:inset 0 -.1em 0 #f04e23;padding:0 .06em;box-decoration-break:clone;-webkit-box-decoration-break:clone}

@media (max-width:860px){
  .ctx{min-height:72px}
  .inner{flex-direction:column;text-align:center;gap:26px;padding:40px 20px}
  .badge{width:92px;height:92px}
  .circle svg{width:46px;height:46px}
  .check{width:38px;height:38px}
  p.msg{font-size:clamp(26px,7.4vw,32px)}
}
@media (prefers-reduced-motion:reduce){
  .strip .check,.strip .check path{animation:none!important;transform:none!important;opacity:1!important;stroke-dashoffset:0!important}
}
</style>
</head>
<body>
<div class="ctx top" aria-hidden="true" data-artboard-only>Sección anterior · contexto</div>

<section class="strip" id="requisito" aria-label="Requisito">
  <div class="inner">
    <div class="badge" aria-hidden="true">
      <div class="circle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" focusable="false"><path d="M3 9.5 4.6 4.5h14.8L21 9.5"/><path d="M3 9.5a3 3 0 0 0 6 0 3 3 0 0 0 6 0 3 3 0 0 0 6 0"/><path d="M5 12.5V20h14v-7.5"/><path d="M10 20v-4.5h4V20"/></svg>
      </div>
      <span class="check"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" focusable="false"><path d="M4.5 12.5 9.8 17.8 19.5 6.5"/></svg></span>
    </div>
    <p class="msg">Para solicitar tu asesoría y crédito <strong>solo</strong> necesitas tener <strong>negocio propio</strong></p>
  </div>
</section>

<div class="ctx bot" aria-hidden="true" data-artboard-only>Sección siguiente · contexto</div>

<script>
(function(){
  var s=document.querySelector('.strip');
  var rm=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(rm||!('IntersectionObserver' in window)){s.classList.add('in');return}
  document.documentElement.classList.add('js');
  var r=s.getBoundingClientRect();if(r.top<innerHeight&&r.bottom>0){setTimeout(function(){s.classList.add('in')},150);return}
  new IntersectionObserver(function(e,o){if(e[0].isIntersecting){s.classList.add('in');o.disconnect()}},{threshold:.2}).observe(s);
})();
</script>
</body>
</html>
